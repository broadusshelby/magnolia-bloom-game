<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnolia Bloom Flower Chase</title>
<style>
body {
  margin:0;
  font-family:Georgia,serif;
  background:linear-gradient(to bottom,#fff7fa,#fdeef4);
  display:flex;
  flex-direction:column;
  align-items:center;
  color:#7a4b5d;
}
h1 {
  margin-top:20px;
  font-size:42px;
  letter-spacing:2px;
}
#score,#level {
  font-size:22px;
  margin-bottom:8px;
}
#game {
  display:grid;
  grid-template-columns:repeat(15,40px);
  grid-template-rows:repeat(15,40px);
  gap:2px;
  background:rgba(255,255,255,0.7);
  padding:12px;
  border-radius:30px;
  box-shadow:0 10px 30px rgba(0,0,0,0.12);
}
.cell {
  width:40px;
  height:40px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
  border-radius:10px;
}
.wall { background:#e9c8d6; }
.path { background:#fff; }
#instructions {
  margin:20px;
  font-size:16px;
}
button {
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#d9a8ba;
  color:white;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>Magnolia Bloom Flower Chase</h1>
<div id="score">Score: 0</div>
<div id="level">Level: 1</div>
<div id="game"></div>
<div id="instructions">Use your arrow keys to guide the magnolia blossom through the garden.</div>
<button onclick="restartGame()">Restart Garden</button>

<script>
const size = 15;
let score = 0;
let level = 1;
let player = {x:1,y:1};
let bee = {x:13,y:13};
let board = [];
let beeMoves = 1;

function createBoard(){
  board = [];
  for(let y=0;y<size;y++){
    let row = [];
    for(let x=0;x<size;x++){
      if(y===0 || x===0 || y===size-1 || x===size-1 || (x%4===0 && y%3===0)){
        row.push(1);
      } else {
        row.push(0);
      }
    }
    board.push(row);
  }
  board[1][1] = 2;
}

function drawGame(){
  const game = document.getElementById('game');
  game.innerHTML = '';
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const cell = document.createElement('div');
      cell.className = 'cell ' + (board[y][x]===1 ? 'wall' : 'path');

      if(player.x===x && player.y===y){
        cell.innerHTML = '🌸';
      } else if(bee.x===x && bee.y===y){
        cell.innerHTML = '🐝';
      } else if(board[y][x]===0){
        cell.innerHTML = '✿';
      }

      game.appendChild(cell);
    }
  }

  document.getElementById('score').innerText = 'Score: ' + score;
  document.getElementById('level').innerText = 'Level: ' + level;
}

function moveBee(){
  for(let m=0;m<beeMoves;m++){
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    let options = dirs.filter(d=>{
      let nx = bee.x + d[0];
      let ny = bee.y + d[1];
      return board[ny][nx] !== 1;
    });
    let pick = options[Math.floor(Math.random()*options.length)];
    bee.x += pick[0];
    bee.y += pick[1];
  }
}

function remainingFlowers(){
  let count = 0;
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      if(board[y][x]===0) count++;
    }
  }
  return count;
}

function nextLevel(){
  level++;
  beeMoves = Math.min(level,3);
  alert('Garden Bloom Complete! Welcome to Level ' + level);
  player = {x:1,y:1};
  bee = {x:13,y:13};
  createBoard();
  drawGame();
}

function checkCollision(){
  if(player.x===bee.x && player.y===bee.y){
    alert('Oh no! The bee found your blossom. Final Score: ' + score + ' | You reached Level ' + level);
    restartGame();
  }
}

document.addEventListener('keydown',function(e){
  let nx = player.x;
  let ny = player.y;

  if(e.key==='ArrowUp') ny--;
  if(e.key==='ArrowDown') ny++;
  if(e.key==='ArrowLeft') nx--;
  if(e.key==='ArrowRight') nx++;

  if(board[ny][nx]!==1){
    player.x = nx;
    player.y = ny;

    if(board[ny][nx]===0){
      board[ny][nx] = 2;
      score += 10;
    }

    moveBee();
    checkCollision();

    if(remainingFlowers()===0){
      nextLevel();
    }

    drawGame();
  }
});

function restartGame(){
  score = 0;
  level = 1;
  beeMoves = 1;
  player = {x:1,y:1};
  bee = {x:13,y:13};
  createBoard();
  drawGame();
}

createBoard();
drawGame();
</script>

</body>
</html>
